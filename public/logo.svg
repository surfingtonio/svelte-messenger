<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- App background tile -->
  <rect width="64" height="64" rx="16" fill="#6c63ff"/>

  <!-- Rear bubble (smaller, offset) -->
  <rect x="20" y="10" width="34" height="26" rx="9" fill="white" fill-opacity="0.35"/>
  <polygon points="44,36 50,44 38,36" fill="white" fill-opacity="0.35"/>

  <!-- Main speech bubble -->
  <rect x="10" y="18" width="36" height="26" rx="9" fill="white"/>
  <!-- Tail -->
  <polygon points="18,44 12,54 26,44" fill="white"/>

  <!-- Three typing dots -->
  <circle cx="22" cy="31" r="3" fill="#6c63ff"/>
  <circle cx="28" cy="31" r="3" fill="#6c63ff" opacity="0.7"/>
  <circle cx="34" cy="31" r="3" fill="#6c63ff" opacity="0.45"/>
</svg>
